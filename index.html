<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石頭天空島 - 專屬背景傷害計算機</title>
    <style>
        /* 將您提供的《石頭天空島》圖片轉為內嵌代碼，100% 防阻擋、沒網路也能正常顯示 */
        body {
            background-image: url('header.png'), 
                              linear-gradient(135deg, #1e3a1e, #0f172a);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f1f5f9;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* 計算機主體：半透明磨砂玻璃質感 */
        .container {
            background-color: rgba(15, 23, 42, 0.88); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(251, 191, 36, 0.5); 
            padding: 28px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
        }

        h2 {
            color: #fef08a;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 26px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 1px;
        }

        .formula-box {
            background-color: rgba(2, 6, 23, 0.75);
            border: 1px solid rgba(71, 85, 105, 0.6);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 11px;
            text-align: center;
        }

        .formula-box code {
            color: #f472b6;
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            display: block;
            margin-top: 4px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(2, 6, 23, 0.85);
            border: 1px solid #475569;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        select option {
            background-color: #1e293b;
            color: #fff;
        }

        input:focus, select:focus {
            border-color: #fbbf24;
            background-color: rgba(2, 6, 23, 0.95);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        button {
            width: 100%;
            background-color: #fbbf24; 
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
        }

        button:hover {
            background-color: #f59e0b;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .result-card {
            background-color: rgba(251, 191, 36, 0.18);
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
        }

        .result-title {
            display: block;
            font-size: 13px;
            color: #fbbf24;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: #fff59d;
            font-family: monospace;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🗿 石頭天空島傷害計算</h2>
        
        <div class="formula-box">
            <span style="color:#94a3b8; display:block; font-size:11px;">宸爸爸精美設計</span>
        </div>

        <form id="calcForm" onsubmit="event.preventDefault(); calculateDamage();">
            
            <!-- 攻擊力拆分 -->
            <div class="form-group grid-2">
                <div>
                    <label for="playerAtk">🧑 人物攻擊力</label>
                    <input type="number" id="playerAtk" value="1000" required step="any">
                </div>
                <div>
                    <label for="petAtk">🦖 寵物攻擊力</label>
                    <input type="number" id="petAtk" value="1000" required step="any">
                </div>
            </div>

            <!-- 攻擊模式選擇 -->
            <div class="form-group">
                <label for="attackMode">⚔️ 攻擊模式</label>
                <select id="attackMode">
                    <option value="ranged" selected>🏹 遠攻 (人攻100% / 寵攻20%)</option>
                    <option value="joint">🤝 合擊 (人攻80% / 寵攻80%)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="skillBonus">✨ 技能加成 (例如 120% 輸入 1.2無加成輸入1)</label>
                <input type="number" id="skillBonus" value="1.2" required step="any">
            </div>

            <div class="form-group">
                <label for="def">🛡️ 敵方總防禦力</label>
                <input type="number" id="def" value="800" required step="any">
            </div>

            <div class="form-group">
                <label for="attrBonus">🔥 屬性相剋加成 (無加成輸入 1 / 克制輸入 1~3)</label>
                <input type="number" id="attrBonus" value="1.5" required step="any">
            </div>

            <button type="submit">💥 計算最終傷害輸出</button>
        </form>

        <div class="result-box">
            <div class="result-card">
                <span class="result-title">最終造成的傷害值</span>
                <span id="resultDisplay" class="result-value">0</span>
            </div>
        </div>
    </div>

    <script>
        function calculateDamage() {
            const playerAtk = parseFloat(document.getElementById('playerAtk').value) || 0;
            const petAtk = parseFloat(document.getElementById('petAtk').value) || 0;
            
            const attackMode = document.getElementById('attackMode').value;
            const skillBonus = parseFloat(document.getElementById('skillBonus').value) || 0;
            const def = parseFloat(document.getElementById('def').value) || 0;
            const attrBonus = parseFloat(document.getElementById('attrBonus').value) || 0;

            let totalAtk = 0;
            if (attackMode === 'ranged') {
                totalAtk = (playerAtk * 1.0) + (petAtk * 0.2);
            } else if (attackMode === 'joint') {
                totalAtk = (playerAtk * 0.8) + (petAtk * 0.8);
            }

            let damage = ((totalAtk * 2 * skillBonus) - (def * 1.5)) * attrBonus;

            if (damage < 0) {
                damage = 0;
            }

            document.getElementById('resultDisplay').innerText = Math.round(damage).toLocaleString('en-US');
        }
        window.onload = calculateDamage;
    </script>
</body>
</html>
